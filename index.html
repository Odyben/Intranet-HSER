    <!-- Google OAuth Logic -->
    <script>
        // =============================================
        // GOOGLE OAUTH CONFIG
        // =============================================
        // ⚠️ GANTI CLIENT_ID ni dengan Client ID dari Google Cloud Console
        const GOOGLE_CLIENT_ID = '790007564350-mrlqp9rgfmuhhov3adbpe0fprgfs8s71.apps.googleusercontent.com';

        // Domain email yang dibenarkan
        const ALLOWED_DOMAIN = 'moh.gov.my';

        // =============================================
        // GOOGLE SIGN-IN HANDLER
        // =============================================
        function handleGoogleLogin() {
            const client = google.accounts.oauth2.initTokenClient({
                client_id: GOOGLE_CLIENT_ID,
                scope: 'email profile',
                callback: handleGoogleResponse,
            });
            client.requestAccessToken();
        }

        function handleGoogleResponse(response) {
            if (response.error) {
                showStatus('Gagal log masuk. Sila cuba lagi.', 'error');
                return;
            }

            // Get user info from Google
            fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
                headers: { 'Authorization': 'Bearer ' + response.access_token }
            })
                .then(res => res.json())
                .then(user => {
                    console.log('Google User:', user);

                    const email = user.email || '';
                    const name = user.name || '';
                    const picture = user.picture || '';
                    const domain = email.split('@')[1];

                    // Check domain
                    if (domain === ALLOWED_DOMAIN || email === 'elvinharrizon@moh.gov.my') {
                        // ✅ Email verified!
                        showStatus('✅ Memuatkan profil...', 'success');

                        // Call API to check/insert user and get role
                        fetch('api/login.php', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ email: email, name: name })
                        })
                        .then(res => res.json())
                        .then(data => {
                            if (data.error) {
                                showStatus('❌ Ralat: ' + data.error, 'error');
                                return;
                            }
                            
                            showStatus('✅ Berjaya! Selamat datang, ' + name, 'success');

                            // Simpan user info
                            localStorage.setItem('user_name', name);
                            localStorage.setItem('user_email', email);
                            localStorage.setItem('user_picture', picture);
                            localStorage.setItem('user_authenticated', 'true');
                            localStorage.setItem('user_role', data.role || 'staff');
                            localStorage.setItem('user_modules', JSON.stringify(data.modules || []));

                            // Redirect ke dashboard
                            setTimeout(function () {
                                window.location.href = 'dashboard.html';
                            }, 1000);
                        })
                        .catch(err => {
                            console.error('Login API Error:', err);
                            showStatus('Ralat pelayan.', 'error');
                        });

                    } else {
                        // ❌ Bukan email MOH
                        showStatus('❌ Hanya email @moh.gov.my dibenarkan.', 'error');
                    }
                })
                .catch(err => {
                    console.error('Error:', err);
                    showStatus('Ralat mendapatkan maklumat pengguna.', 'error');
                });
        }

        function showStatus(message, type) {
            const statusEl = document.getElementById('login-status');
            statusEl.style.display = 'block';
            statusEl.textContent = message;
            statusEl.className = 'login-status ' + (type === 'success' ? 'status-success' : 'status-error');
        }

        // =============================================
        // PWA INSTALLATION LOGIC
        // =============================================
        let deferredPrompt;
        const pwaPrompt = document.getElementById('pwa-install-prompt');
        const btnInstall = document.getElementById('btn-pwa-install');
        const btnCancel = document.getElementById('btn-pwa-cancel');

        window.addEventListener('beforeinstallprompt', (e) => {
            // Prevent Chrome 67 and earlier from automatically showing the prompt
            e.preventDefault();
            // Stash the event so it can be triggered later.
            deferredPrompt = e;
            // Update UI to notify the user they can add to home screen
            pwaPrompt.style.display = 'block';
        });

        btnInstall.addEventListener('click', async () => {
            // Hide the app provided install promotion
            pwaPrompt.style.display = 'none';
            // Show the install prompt
            if (deferredPrompt) {
                deferredPrompt.prompt();
                // Wait for the user to respond to the prompt
                const { outcome } = await deferredPrompt.userChoice;
                console.log(`User response to the install prompt: ${outcome}`);
                // We've used the prompt, and can't use it again, throw it away
                deferredPrompt = null;
            }
        });

        btnCancel.addEventListener('click', () => {
            pwaPrompt.style.display = 'none';
        });

        // Register Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(registration => {
                        console.log('ServiceWorker registration successful with scope: ', registration.scope);
                    }, err => {
                        console.log('ServiceWorker registration failed: ', err);
                    });
            });
        }
    </script>
